[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
sha2 = "0.11"

[target.'cfg(target_os = "windows")'.dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1.10"
tar = "0.4"
toml = "1.1"
xz2 = "0.1"
