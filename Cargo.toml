[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "ezz"
version = "3.0.0"
edition = "2024"

[[bin]]
name = "ezz"
path = "src/main.rs"

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tempfile = "3"
thiserror = "2"
time = "0.3"
trash = "5.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-user-notifications = { version = "0.3.2", features = ["block2"] }
block2 = "0.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Data_Xml_Dom",
    "UI_Notifications",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
zip = { version = "8", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
