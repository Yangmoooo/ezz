[workspace]
members = ["xtask"]
default-members = ["."]
resolver = "3"

[package]
name = "ezz"
version = "3.0.0"
edition = "2024"

[[bin]]
name = "ezz"
path = "src/main.rs"

[dependencies]
log = "0.4"
notify-rust = "4.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
simplelog = "0.12"
tempfile = "3"
thiserror = "2"
time = "0.3"
trash = "5.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
native-windows-derive = "1.0.5"
# `image-decoder` 是零依赖的特性开关，但**不能缺**：密码弹窗用 `source_bin` 从内存
# 加载图标，缺了它会在弹窗构建时 panic（v2.0.6 用的是默认特性 `all`，所以没这个问题）。
# Phase 5 改用资源表里的 `DIALOGEX` 后，图标走 `LoadIconW`，这个特性可以再去掉。
native-windows-gui = { version = "1.0.13", default-features = false, features = ["file-dialog", "high-dpi", "image-decoder"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell"] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[dev-dependencies]
zip = { version = "6", default-features = false, features = ["deflate"] }

[profile.release]
lto = "fat"
panic = "abort"
codegen-units = 1
