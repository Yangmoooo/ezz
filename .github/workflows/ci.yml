name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  RUSTFLAGS: --deny warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64

    steps:
      - uses: actions/checkout@v6

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare fixed 7-Zip
        run: cargo xtask prepare

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run real 7-Zip end-to-end tests
        run: cargo test --workspace --all-targets --locked -- --ignored

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # 发布物在两个平台上真实生成并检查内容；macOS 打包只有这里能执行。
      - name: Package release artifact
        run: cargo xtask package

      - name: Verify the packaged artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -eu
          test "$(uname -m)" = "arm64"

          version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/')"
          dmg=target/dist/ezz-macos-arm64.dmg
          mount=/tmp/ezz-dmg
          test -f "$dmg"
          if ls target/dist | grep -Eq 'ezz-[0-9]+\.[0-9]+'; then
            echo "artifact name contains a version" >&2
            exit 1
          fi

          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/ezz.app"
          test -d "$app"
          test "$(readlink "$mount/Applications")" = "/Applications"
          test -f "$mount/README.md"
          test -f "$mount/CHANGELOG.md"
          test -f "$app/Contents/MacOS/ezz"
          test -f "$app/Contents/MacOS/7zz"
          test -f "$app/Contents/Resources/ezz.icns"
          test -f "$app/Contents/Resources/licenses/ezz-LICENSE.txt"
          test -f "$app/Contents/Resources/licenses/unRarLicense.txt"
          plutil -extract CFBundleDisplayName raw "$app/Contents/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$app/Contents/Info.plist")" = "$version"
          codesign --verify --deep --strict "$app"

          # 直接运行包内的二进制：引擎必须与主程序并列。
          work="$PWD/target/e2e"
          rm -rf "$work" && mkdir -p "$work/in"
          printf 'packaged artifact check\n' > "$work/in/payload.txt"
          (cd "$work/in" && "$app/Contents/MacOS/7zz" a "$work/archive.zip" payload.txt)
          "$app/Contents/MacOS/ezz" "$work/archive.zip"
          grep -q "packaged artifact check" "$work/payload.txt"
          hdiutil detach "$mount"

      - name: Verify the packaged artifact (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -eu
          version="$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml | grep -m1 '^version' | sed -E 's/.*"([^"]+)".*/\1/')"
          zip=target/dist/ezz-windows-x64.zip
          test -f "$zip"
          if ls target/dist | grep -Eq 'ezz-[0-9]+\.[0-9]+'; then
            echo "artifact name contains a version" >&2
            exit 1
          fi

          powershell -NoProfile -Command "Expand-Archive -Force '$zip' target/dist/verify"
          stage="$PWD/target/dist/verify/ezz-windows-x64"
          test -f "$stage/ezz.exe"
          test -f "$stage/7zz.exe"
          test -f "$stage/README.md"
          test -f "$stage/CHANGELOG.md"
          test -f "$stage/licenses/ezz-LICENSE.txt"
          test -f "$stage/licenses/unRarLicense.txt"

          # PowerShell 看不懂 bash 风格路径，先转成 Windows 路径。
          stage_win="$(cygpath -w "$stage")"
          powershell -NoProfile -Command "
            \$info = (Get-Item '$stage_win\\ezz.exe').VersionInfo
            if (\$info.ProductName -ne 'Ezz') { throw \"ProductName is \$(\$info.ProductName)\" }
            if (\$info.FileDescription -ne 'Ezz archive extractor') { throw \"FileDescription is \$(\$info.FileDescription)\" }
            if (\$info.CompanyName -ne '') { throw \"CompanyName is \$(\$info.CompanyName)\" }
            if (\$info.OriginalFilename -ne 'ezz.exe') { throw \"OriginalFilename is \$(\$info.OriginalFilename)\" }
            if (\$info.ProductVersion -ne '$version') { throw \"ProductVersion is \$(\$info.ProductVersion) but Cargo.toml says $version\" }
          "

          # 用户拿到 ZIP 之后也是解压再运行，这里照做一遍。
          work="$PWD/target/e2e"
          rm -rf "$work" && mkdir -p "$work/in"
          printf 'packaged artifact check\n' > "$work/in/payload.txt"
          (cd "$work/in" && "$stage/7zz.exe" a "$work/archive.zip" payload.txt)
          "$stage/ezz.exe" "$(cygpath -w "$work/archive.zip")"
          grep -q "packaged artifact check" "$work/payload.txt"
